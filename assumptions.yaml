# ServiceNow long-range plan (LRP) assumptions
# All $ figures in millions. Percentages are stored as fractions (0.225 = 22.5%).
#
# FY2026 is anchored to company guidance (Q3 2026 earnings release, Oct 2026) and is the
# same in every scenario: three quarters are already reported. Scenarios diverge from FY2027.

company: "ServiceNow, Inc. (NYSE: NOW)"
base_year: 2025
forecast_years: [2026, 2027, 2028, 2029, 2030]

# FY2026 company guidance, used to check the model ties to the operating plan.
guidance_2026:
  sub_rev_low: 15780
  sub_rev_high: 15790
  sub_gm_gaap: 0.75
  gaap_om: 0.10
  ng_om: 0.315
  fcf_margin: 0.36
  source: "ServiceNow Q3 2026 earnings release (Form 8-K, Oct 2026)"

drivers:
  sub_growth:      {label: "Subscription revenue growth", fmt: pct}
  ps_growth:       {label: "Professional services revenue growth", fmt: pct}
  sub_gm:          {label: "Subscription gross margin (GAAP)", fmt: pct}
  ps_gm:           {label: "Professional services gross margin (GAAP)", fmt: pct}
  sm_pct:          {label: "Sales & marketing, % of revenue (GAAP)", fmt: pct}
  rd_pct:          {label: "R&D, % of revenue (GAAP)", fmt: pct}
  ga_pct:          {label: "G&A, % of revenue (GAAP)", fmt: pct}
  sbc_pct:         {label: "Stock-based comp, % of revenue", fmt: pct}
  other_adj_pct:   {label: "Amortization & acquisition costs, % of revenue", fmt: pct}
  cash_tax_rate:   {label: "Cash taxes, % of non-GAAP operating income", fmt: pct}
  wc_capture:      {label: "Working capital inflow, % of revenue increase", fmt: pct}
  net_interest_pct: {label: "Net interest & other cash income, % of revenue", fmt: pct}
  capex_pct:       {label: "Capex, % of revenue", fmt: pct}
  rev_per_emp_growth: {label: "Revenue per employee growth (AI productivity)", fmt: pct}
  crpo_ratio:      {label: "cRPO / subscription revenue (year end)", fmt: x}

scenarios:
  base:
    description: >
      Growth glides from ~22% to 16% as the base matures; AI products (Now Assist) offset
      seat-pricing pressure. Acquisition amortization fades, S&M leverage continues,
      non-GAAP operating margin reaches ~34% by 2030.
    drivers:
      sub_growth:         [0.2253, 0.190, 0.180, 0.170, 0.160]
      ps_growth:          [0.100, 0.080, 0.080, 0.080, 0.080]
      sub_gm:             [0.750, 0.760, 0.770, 0.775, 0.780]
      ps_gm:              [-0.100, -0.080, -0.080, -0.080, -0.080]
      sm_pct:             [0.324, 0.318, 0.310, 0.302, 0.295]
      rd_pct:             [0.227, 0.225, 0.223, 0.220, 0.218]
      ga_pct:             [0.076, 0.074, 0.072, 0.070, 0.068]
      sbc_pct:            [0.155, 0.150, 0.145, 0.140, 0.135]
      other_adj_pct:      [0.060, 0.050, 0.040, 0.030, 0.025]
      cash_tax_rate:      [0.100, 0.110, 0.120, 0.130, 0.140]
      wc_capture:         [0.450, 0.450, 0.450, 0.450, 0.450]
      net_interest_pct:   [0.025, 0.025, 0.025, 0.025, 0.025]
      capex_pct:          [0.030, 0.035, 0.035, 0.035, 0.035]
      rev_per_emp_growth: [0.080, 0.070, 0.070, 0.060, 0.060]
      crpo_ratio:         [0.990, 0.990, 0.990, 0.990, 0.990]

  upside:
    description: >
      Agentic AI monetizes faster than seats decline: growth re-accelerates to ~20% and holds,
      AI-driven efficiency pushes revenue per employee up faster, margin reaches ~36%.
    drivers:
      sub_growth:         [0.2253, 0.210, 0.200, 0.190, 0.180]
      ps_growth:          [0.100, 0.100, 0.100, 0.100, 0.100]
      sub_gm:             [0.750, 0.765, 0.775, 0.785, 0.790]
      ps_gm:              [-0.100, -0.070, -0.060, -0.050, -0.050]
      sm_pct:             [0.324, 0.312, 0.300, 0.290, 0.280]
      rd_pct:             [0.227, 0.224, 0.220, 0.217, 0.214]
      ga_pct:             [0.076, 0.072, 0.069, 0.066, 0.063]
      sbc_pct:            [0.155, 0.148, 0.141, 0.134, 0.127]
      other_adj_pct:      [0.060, 0.050, 0.040, 0.030, 0.025]
      cash_tax_rate:      [0.100, 0.110, 0.120, 0.130, 0.140]
      wc_capture:         [0.450, 0.470, 0.470, 0.470, 0.470]
      net_interest_pct:   [0.025, 0.026, 0.027, 0.028, 0.028]
      capex_pct:          [0.030, 0.035, 0.035, 0.035, 0.035]
      rev_per_emp_growth: [0.080, 0.090, 0.090, 0.080, 0.080]
      crpo_ratio:         [0.990, 1.000, 1.000, 1.000, 1.000]

  downside:
    description: >
      AI agents shrink seat counts and pricing faster than new AI products replace them;
      growth slows to ~10% by 2030. Management protects investment, so margin stalls near 31%.
    drivers:
      sub_growth:         [0.2253, 0.160, 0.135, 0.115, 0.100]
      ps_growth:          [0.100, 0.050, 0.030, 0.030, 0.030]
      sub_gm:             [0.750, 0.755, 0.760, 0.765, 0.770]
      ps_gm:              [-0.100, -0.100, -0.100, -0.100, -0.100]
      sm_pct:             [0.324, 0.326, 0.322, 0.318, 0.315]
      rd_pct:             [0.227, 0.230, 0.230, 0.228, 0.226]
      ga_pct:             [0.076, 0.076, 0.075, 0.074, 0.073]
      sbc_pct:            [0.155, 0.155, 0.152, 0.150, 0.148]
      other_adj_pct:      [0.060, 0.050, 0.040, 0.030, 0.025]
      cash_tax_rate:      [0.100, 0.110, 0.120, 0.130, 0.140]
      wc_capture:         [0.450, 0.400, 0.400, 0.400, 0.400]
      net_interest_pct:   [0.025, 0.024, 0.023, 0.022, 0.022]
      capex_pct:          [0.030, 0.035, 0.035, 0.035, 0.035]
      rev_per_emp_growth: [0.080, 0.050, 0.050, 0.040, 0.040]
      crpo_ratio:         [0.990, 0.970, 0.960, 0.960, 0.960]

# Sensitivity analysis: each driver is shifted by +/- this amount in every forecast year
# from FY2027 onward (FY2026 stays on guidance). Output measured = FY2030 free cash flow.
sensitivity:
  target_year: 2030
  shocks:
    sub_growth: 0.02
    sm_pct: 0.015
    rd_pct: 0.01
    sub_gm: 0.01
    capex_pct: 0.01
    cash_tax_rate: 0.03
    wc_capture: 0.10
  two_way:
    rows: {driver: sub_growth, steps: [-0.04, -0.02, 0.0, 0.02, 0.04]}
    cols: {driver: sm_pct, steps: [-0.02, -0.01, 0.0, 0.01, 0.02]}

# Investment proposal evaluator. A hypothetical example of the kind of request an LRP
# team evaluates: fund extra AI-agent go-to-market and engineering capacity.
investment_case:
  name: "Agentic AI go-to-market expansion (illustrative)"
  description: >
    Hire specialist AI sellers and solution engineers in FY2027-28 to accelerate Now Assist /
    AI Agents attach. Figures are illustrative assumptions, not ServiceNow data.
  years: [2027, 2028, 2029, 2030, 2031]
  upfront_investment: [250, 200, 0, 0, 0]        # one-time opex/capex, $M
  incremental_revenue: [60, 220, 420, 560, 650]   # incremental subscription revenue, $M
  run_rate_cost: [80, 130, 150, 160, 165]         # ongoing cost of the added team, $M
  contribution_margin: 0.80                       # gross margin on incremental revenue
  cash_tax_rate: 0.14
  discount_rate: 0.09                             # illustrative WACC
  terminal_growth: 0.03
  hurdle_payback_years: 4
